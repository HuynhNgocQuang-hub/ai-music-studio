services:
  redis:
    image: redis:7-alpine
    container_name: ai-music-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-music-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aimusic}
      POSTGRES_USER: ${DATABASE_USER:-aimusic}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-aimusic_dev_pass}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-aimusic} -d ${POSTGRES_DB:-aimusic}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ai-music-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  audio-worker:
    build:
      context: ./audio-worker
      dockerfile: Dockerfile
    container_name: ai-music-audio-worker
    ports:
      - "127.0.0.1:${AUDIO_WORKER_HOST_PORT:-8001}:8001"
    environment:
      SAMPLE_RATE: ${SAMPLE_RATE:-44100}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      SOUNDFONT_PATH: ${SOUNDFONT_PATH:-/usr/share/sounds/sf2/FluidR3_GM.sf2}
      MASTER_LIMITER_CEILING_DB: ${MASTER_LIMITER_CEILING_DB:--1.0}
      TARGET_LUFS: ${TARGET_LUFS:--14.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-music-backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      AUDIO_WORKER_URL: ${DOCKER_AUDIO_WORKER_URL:-http://audio-worker:8001}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-jdbc:postgresql://postgres:5432/aimusic}
      DATABASE_USER: ${DATABASE_USER:-aimusic}
      DATABASE_PASS: ${DATABASE_PASS:-aimusic_dev_pass}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-aimusic-cloud}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-}
      QUOTA_DAILY_GENERATE: ${QUOTA_DAILY_GENERATE:-30}
      QUOTA_DAILY_EXPORT: ${QUOTA_DAILY_EXPORT:-50}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PROJECT_TTL_SECONDS: ${PROJECT_TTL_SECONDS:-86400}
      AUDIO_TTL_SECONDS: ${AUDIO_TTL_SECONDS:-43200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MASTER_LIMITER_CEILING_DB: ${MASTER_LIMITER_CEILING_DB:--1.0}
      TARGET_LUFS: ${TARGET_LUFS:--14.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://localhost:8443}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      audio-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ai-music-caddy
    ports:
      - "127.0.0.1:${HTTP_PROXY_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-host.docker.internal:3000}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
