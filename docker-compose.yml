services:
  redis:
    image: redis:7-alpine
    container_name: ai-music-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  audio-worker:
    build:
      context: ./audio-worker
      dockerfile: Dockerfile
    container_name: ai-music-audio-worker
    ports:
      - "127.0.0.1:${AUDIO_WORKER_HOST_PORT:-8001}:8001"
    environment:
      SAMPLE_RATE: ${SAMPLE_RATE:-44100}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      SOUNDFONT_PATH: ${SOUNDFONT_PATH:-/usr/share/sounds/sf2/FluidR3_GM.sf2}
      MASTER_LIMITER_CEILING_DB: ${MASTER_LIMITER_CEILING_DB:--1.0}
      TARGET_LUFS: ${TARGET_LUFS:--14.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-music-backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      AUDIO_WORKER_URL: ${DOCKER_AUDIO_WORKER_URL:-http://audio-worker:8001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PROJECT_TTL_SECONDS: ${PROJECT_TTL_SECONDS:-86400}
      AUDIO_TTL_SECONDS: ${AUDIO_TTL_SECONDS:-43200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MASTER_LIMITER_CEILING_DB: ${MASTER_LIMITER_CEILING_DB:--1.0}
      TARGET_LUFS: ${TARGET_LUFS:--14.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      redis:
        condition: service_healthy
      audio-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
